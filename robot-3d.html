<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Robot - Cursor Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff88;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            border: 2px solid #00ff88;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #ff6b35;
            text-shadow: 0 0 10px #ff6b35;
        }

        .info-line {
            margin: 5px 0;
            font-size: 14px;
        }

        .cursor-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff88;
            padding: 15px 25px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            border: 2px solid #ff6b35;
            z-index: 100;
        }

        .cursor-label {
            color: #ff6b35;
            font-weight: bold;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .title h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        .title p {
            font-size: 18px;
            color: #00ff88;
            opacity: 0.8;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 107, 53, 0.8); }
        }

        @media (max-width: 768px) {
            .info-panel {
                font-size: 12px;
                padding: 15px;
                top: 10px;
                left: 10px;
            }

            .title h1 {
                font-size: 32px;
            }

            .title p {
                font-size: 14px;
            }

            .cursor-info {
                font-size: 12px;
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="info-panel">
        <h3>🤖 ROBOT VISION</h3>
        <div class="info-line">Status: <span style="color: #00ff88;">● ONLINE</span></div>
        <div class="info-line">Tracking: <span style="color: #ff6b35;">ACTIVE</span></div>
        <div class="info-line">AI Mode: <span style="color: #00ff88;">ENABLED</span></div>
    </div>

    <div class="title">
        <h1>3D Robot</h1>
        <p>👁️ Move your cursor to control the robot's gaze</p>
    </div>

    <div class="cursor-info">
        <div class="info-line">
            <span class="cursor-label">X:</span> <span id="cursorX">0</span>px
        </div>
        <div class="info-line">
            <span class="cursor-label">Y:</span> <span id="cursorY">0</span>px
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x667eea);
        scene.fog = new THREE.Fog(0x667eea, 1000, 3000);

        const canvas = document.querySelector('#canvas-container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        canvas.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xff6b35, 0.5);
        pointLight.position.set(-5, 5, 5);
        scene.add(pointLight);

        // Create Robot
        function createRobot() {
            const robot = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.5, 0.6, 1.2, 32);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                metalness: 0.7,
                roughness: 0.2,
                emissive: 0xff6b35,
                emissiveIntensity: 0.2
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            body.position.y = 0;
            robot.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.45, 32, 32);
            const headMaterial = new THREE.MeshStandardMaterial({
                color: 0x0d0d0d,
                metalness: 0.8,
                roughness: 0.1,
                emissive: 0xff6b35,
                emissiveIntensity: 0.15
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.castShadow = true;
            head.receiveShadow = true;
            head.position.y = 1.1;
            robot.add(head);

            // Eyes group (for cursor tracking)
            const eyesGroup = new THREE.Group();
            eyesGroup.position.y = 1.15;
            robot.add(eyesGroup);

            // Left eye
            const eyeGeometry = new THREE.SphereGeometry(0.12, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({
                color: 0xff6b35,
                metalness: 0.9,
                roughness: 0,
                emissive: 0xff6b35,
                emissiveIntensity: 0.8
            });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.15, 0.1, 0.35);
            eyesGroup.add(leftEye);

            // Right eye
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.15, 0.1, 0.35);
            eyesGroup.add(rightEye);

            // Left pupil (will follow cursor)
            const pupilGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const pupilMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                metalness: 1,
                roughness: 0.3
            });
            const leftPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            leftPupil.position.set(-0.15, 0.1, 0.46);
            eyesGroup.add(leftPupil);

            // Right pupil
            const rightPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            rightPupil.position.set(0.15, 0.1, 0.46);
            eyesGroup.add(rightPupil);

            // Left arm
            const armGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.8, 16);
            const armMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                metalness: 0.7,
                roughness: 0.2
            });
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.castShadow = true;
            leftArm.receiveShadow = true;
            leftArm.position.set(-0.7, 0.3, 0);
            leftArm.rotation.z = 0.3;
            robot.add(leftArm);

            // Right arm
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.castShadow = true;
            rightArm.receiveShadow = true;
            rightArm.position.set(0.7, 0.3, 0);
            rightArm.rotation.z = -0.3;
            robot.add(rightArm);

            // Left hand
            const handGeometry = new THREE.SphereGeometry(0.18, 16, 16);
            const handMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                metalness: 0.8,
                roughness: 0.2
            });
            const leftHand = new THREE.Mesh(handGeometry, handMaterial);
            leftHand.castShadow = true;
            leftHand.receiveShadow = true;
            leftHand.position.set(-0.8, -0.4, 0);
            robot.add(leftHand);

            // Right hand
            const rightHand = new THREE.Mesh(handGeometry, handMaterial);
            rightHand.castShadow = true;
            rightHand.receiveShadow = true;
            rightHand.position.set(0.8, -0.4, 0);
            robot.add(rightHand);

            // Left leg
            const legGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.8, 16);
            const legMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                metalness: 0.7,
                roughness: 0.2
            });
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.castShadow = true;
            leftLeg.receiveShadow = true;
            leftLeg.position.set(-0.3, -1.0, 0);
            robot.add(leftLeg);

            // Right leg
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.castShadow = true;
            rightLeg.receiveShadow = true;
            rightLeg.position.set(0.3, -1.0, 0);
            robot.add(rightLeg);

            // Left foot
            const footGeometry = new THREE.BoxGeometry(0.25, 0.15, 0.4);
            const footMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                metalness: 0.8,
                roughness: 0.2
            });
            const leftFoot = new THREE.Mesh(footGeometry, footMaterial);
            leftFoot.castShadow = true;
            leftFoot.receiveShadow = true;
            leftFoot.position.set(-0.3, -1.5, 0);
            robot.add(leftFoot);

            // Right foot
            const rightFoot = new THREE.Mesh(footGeometry, footMaterial);
            rightFoot.castShadow = true;
            rightFoot.receiveShadow = true;
            rightFoot.position.set(0.3, -1.5, 0);
            robot.add(rightFoot);

            // Chest logo area
            const logoGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.05, 32);
            const logoMaterial = new THREE.MeshStandardMaterial({
                color: 0xff6b35,
                metalness: 0.6,
                roughness: 0.4,
                emissive: 0xff6b35,
                emissiveIntensity: 0.4
            });
            const logo = new THREE.Mesh(logoGeometry, logoMaterial);
            logo.position.set(0, 0.2, 0.52);
            robot.add(logo);

            robot.castShadow = true;
            robot.receiveShadow = true;

            return { robot, eyesGroup, leftPupil, rightPupil };
        }

        const robotData = createRobot();
        const robot = robotData.robot;
        const eyesGroup = robotData.eyesGroup;
        const leftPupil = robotData.leftPupil;
        const rightPupil = robotData.rightPupil;

        scene.add(robot);

        // Cursor tracking variables
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;

        // Update cursor position
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update cursor info display
            document.getElementById('cursorX').textContent = Math.round(event.clientX);
            document.getElementById('cursorY').textContent = Math.round(event.clientY);

            // Calculate target rotation based on cursor position
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.3;
        });

        // Touch support for mobile
        document.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                const touch = event.touches[0];
                mouseX = (touch.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(touch.clientY / window.innerHeight) * 2 + 1;

                targetRotationY = mouseX * 0.3;
                targetRotationX = mouseY * 0.3;

                document.getElementById('cursorX').textContent = Math.round(touch.clientX);
                document.getElementById('cursorY').textContent = Math.round(touch.clientY);
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            const newWidth = window.innerWidth;
            const newHeight = window.innerHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Smooth rotation of the head
            eyesGroup.rotation.y += (targetRotationY - eyesGroup.rotation.y) * 0.1;
            eyesGroup.rotation.x += (targetRotationX - eyesGroup.rotation.x) * 0.1;

            // Gentle robot body rotation following cursor
            robot.rotation.y = mouseX * 0.2;
            robot.rotation.z = mouseX * 0.1;

            // Subtle bobbing animation
            robot.position.y = Math.sin(time * 0.5) * 0.1;

            // Arm wave animation
            const leftArm = robot.children[4];
            const rightArm = robot.children[5];
            
            if (leftArm && rightArm) {
                leftArm.rotation.z = 0.3 + Math.sin(time) * 0.3;
                rightArm.rotation.z = -0.3 - Math.sin(time) * 0.3;
            }

            // Update pupils to follow cursor more responsively
            const pupilDistance = 0.08;
            const pupilX = mouseX * pupilDistance;
            const pupilY = mouseY * pupilDistance;

            leftPupil.position.x = -0.15 + pupilX * 0.5;
            leftPupil.position.y = 0.1 + pupilY * 0.5;

            rightPupil.position.x = 0.15 + pupilX * 0.5;
            rightPupil.position.y = 0.1 + pupilY * 0.5;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
